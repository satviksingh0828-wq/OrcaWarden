services:
  - type: web
    name: orcawarden-stamper
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_OTS_BUCKET
        value: orcawarden-ots
      - key: ORCAWARDEN_ENCRYPTION_KEY
        sync: false
